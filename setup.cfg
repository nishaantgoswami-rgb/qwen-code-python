[metadata]
name = qwen-code-py
description = AI-powered coding assistant CLI tool
long_description = file: README.md
long_description_content_type = text/markdown
author = Qwen Team
author_email = qwen@alibabacloud.com
url = https://github.com/QwenLM/qwen-code-python
project_urls =
    Documentation = https://qwenlm.github.io/qwen-code-python/
    Changelog = https://github.com/QwenLM/qwen-code-python/releases
    Bug Tracker = https://github.com/QwenLM/qwen-code-python/issues
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
license = Apache-2.0
platforms = any

[options]
packages = find:
include_package_data = True
python_requires = >=3.8
install_requires =
    click>=8.0.0
    requests>=2.25.0
    pyyaml>=5.4.0
    rich>=10.0.0
    prompt_toolkit>=3.0.0
    aiohttp>=3.8.0
    async-timeout>=4.0.0

[options.packages.find]
include = qwen_code*

[bdist_wheel]
universal = 1