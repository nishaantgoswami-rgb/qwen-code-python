# prometheus.yml - Prometheus configuration for Qwen Code CLI

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

scrape_configs:
  - job_name: 'qwen-code'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    scheme: http

  # Example for multiple instances
  # - job_name: 'qwen-code-cluster'
  #   static_configs:
  #     - targets: 
  #       - 'qwen-code-1:8000'
  #       - 'qwen-code-2:8000'
  #       - 'qwen-code-3:8000'
  #   metrics_path: /metrics
  #   scrape_interval: 30s
  #   scrape_timeout: 10s