[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-code-py"
description = "AI-powered coding assistant CLI tool"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Qwen Team", email = "qwen@alibabacloud.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "requests>=2.25.0",
    "pyyaml>=5.4.0",
    "rich>=10.0.0",
    "prompt_toolkit>=3.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-asyncio>=0.15.0",
    "black>=21.0.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
]
test = [
    "pytest>=6.0.0",
    "pytest-asyncio>=0.15.0",
    "pytest-cov>=2.12.0",
]

[project.scripts]
qwenpy = "qwen_code.cli.main:main"

[project.urls]
Homepage = "https://github.com/QwenLM/qwen-code-python"
Repository = "https://github.com/QwenLM/qwen-code-python"