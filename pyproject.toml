[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-code-py"
description = "AI-powered coding assistant CLI tool"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Qwen Team", email = "qwen@alibabacloud.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "requests>=2.25.0",
    "pyyaml>=5.4.0",
    "rich>=10.0.0",
    "prompt_toolkit>=3.0.0",
    "aiohttp>=3.8.0",
    "async-timeout>=4.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.10.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-asyncio>=0.15.0",
    "pytest-cov>=2.12.0",
    "black>=21.0.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
    "bandit>=1.7.0",
    "safety>=1.10.0",
]
test = [
    "pytest>=6.0.0",
    "pytest-asyncio>=0.15.0",
    "pytest-cov>=2.12.0",
    "pytest-mock>=3.6.0",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=0.5.0",
    "sphinx-click>=3.0.0",
]

[project.scripts]
qwenpy = "qwen_code.cli.main:main"

[project.urls]
Homepage = "https://github.com/QwenLM/qwen-code-python"
Documentation = "https://qwenlm.github.io/qwen-code-python/"
Repository = "https://github.com/QwenLM/qwen-code-python"
Changelog = "https://github.com/QwenLM/qwen-code-python/releases"
"Bug Tracker" = "https://github.com/QwenLM/qwen-code-python/issues"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["qwen_code*"]

[tool.black]
line-length = 88
target-version = ['py38']